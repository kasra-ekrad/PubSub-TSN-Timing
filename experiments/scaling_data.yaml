# Scaling study 1: more data in every WG. Where do publisher utilization, subscriber
# utilization and the deadlines reach their limit, over many generated systems?
#   python scaling_study.py experiments/scaling_data.yaml [--jobs 4] [--resume]
#   python scaling_study.py experiments/scaling_data.yaml --plot-only
#
# Every seed draws one system on the topology below: WGs per publisher, period, data types
# (one type per variable, drawn in advance), DSMs and WCET coefficients from the scenario's
# ranges. WG i goes to subscriber i mod 2 (evenly). All WGs are AVB (no ST, no best-effort).
# The system must start valid (every utilization below the limit); otherwise the seed is
# drawn again (column `attempts`). Then every WG of every publisher gets one more variable
# per step, until a WG's NetworkMessage no longer fits the MTU or all three limits are crossed.
# The exes run at every step until the first deadline miss.

name: scaling_data
mode: data
scenario: ../scenario.yaml          # WCET ranges, periods, data types, network settings
seeds: [1, 100]

#      1  2  3        4  5  6        7  8  9
#       \ | /          \ | /         | (8, 9 = subscribers)
#        -1 ----------- -2 --------- -3 -- 7 (publisher)
topology:
  links: [[1, -1], [2, -1], [3, -1], [-1, -2], [4, -2], [5, -2], [6, -2], [-2, -3], [7, -3], [8, -3], [9, -3]]
  publishers: [1, 2, 3, 4, 5, 6, 7]
  subscribers: [8, 9]

wgs_per_publisher: [1, 4]           # drawn per publisher
dsms_per_wg: [1, 4]                 # drawn per WG (capped at the number of variables)
start_variables: 1                  # variables per WG at the first step
step: 1                             # variables added per step
max_variables: max                  # max = until the MTU

max_cpu_utilization: 1.0            # limit for sum W/T of every publisher and subscriber
deadline_factor: 1                  # end-to-end deadline D = deadline_factor * T
attempts: 200                       # draws for a valid start
